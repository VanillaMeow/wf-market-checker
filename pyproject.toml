[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "wf-market-checker"
version = "0.1.0"
description = "Warframe Market Order Checker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.2",
    "aiolimiter>=1.2.1",
    "async-lru>=2.0.5",
    "cachetools>=7.0.0",
    "colorama>=0.4.6",
    "discord-py>=2.6.4",
    "platformdirs>=4.3.6",
    "pydantic>=2.12.4",
    "pyperclip>=1.11.0",
    "tomlkit>=0.13.3",
    "yarl>=1.22.0",
]

[dependency-groups]
dev = [
    "icecream>=2.1.10",
    "mypy>=1.19.1",
    "pyright>=1.1.408",
    "ruff>=0.14.11",
    "types-cachetools>=6.2.0.20251022",
    "types-colorama>=0.4.15.20250801",
    "types-pyperclip>=1.9.0.20250801",
]

[project.scripts]
app = "wf_market_checker.__main__:main"
wf-market-checker = "wf_market_checker.__main__:main"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # Handled by Ruff format
    "line-too-long",
    "blank-line-with-whitespace",
    "too-many-blank-lines",
    "missing-trailing-comma",
    "bad-quotes-inline-string",
    "extraneous-parentheses",

    # Documentation and type annotations
    "D",  # Not needed here
    "DOC",
    "any-type",
    "missing-return-type-special-method",
    "missing-return-type-undocumented-public-function",
    "missing-return-type-private-function",

    # Imports and package structure
    "implicit-namespace-package",  # Package lookup can make this annoying
    "useless-import-alias",  # Pyright requires some `as` imports
    "typing-only-first-party-import",  # False positives with Pydantic
    "typing-only-third-party-import",  # False positives with Pydantic
    "typing-only-standard-library-import",  # False positives with Pydantic

    # Function and class design
    "no-self-use",  # Can easily break code
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "too-many-arguments",
    "too-many-public-methods",

    # Complexity and control flow
    "complex-structure",
    "too-many-branches",
    "too-many-locals",
    "too-many-statements",
    "magic-value-comparison",  # I hate this rule
    "implicit-return-value",

    # Exceptions
    "suppressible-exception",
    "raise-vanilla-args",  # Over-eager rule
    "raise-within-try",  # Unrealistic rule
    # "raw-string-in-exception",  # Fine for libs like discord.py

    # Async code
    "unused-async",  # Can easily break code
    "async-function-with-timeout",

    # Logging and console output
    "print",
    "logging-f-string",  # I hate this rule

    # Subprocess security
    "suspicious-subprocess-import",
    "subprocess-popen-with-shell-equals-true",
    "subprocess-without-shell-equals-true",

    # Source and repository hygiene
    "ERA",  # Keep commented-out code
    "missing-todo-link",
    "line-contains-todo",
    "missing-copyright-notice",
    "shebang-missing-executable-file",
    "ambiguous-unicode-character-string",
    "unsorted-dunder-all",  # Public export order is a tested compatibility contract
    "unsorted-dunder-slots",  # Slot order is a tested compatibility contract

    # Data models and library-specific rules
    "function-call-in-dataclass-default-argument",
    "pandas-use-of-dot-values",  # Not a pandas codebase
]
unfixable = [
    "ERA",  # Don't delete commented-out code
    "line-too-long",  # Ruff format handles line length
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
